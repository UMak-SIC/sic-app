name: CI

on:
  # Only pull requests into dev are tested. Promotion PRs (dev -> staging ->
  # main) carry commits that already passed here, so re-running them adds
  # nothing. Branch protection keeps this safe: dev requires PR branches to be
  # up to date, and staging/main only accept promotion PRs.
  #
  # There is no paths filter: lint-and-build is a required check, and a
  # filtered-out run never reports, which would block docs-only PRs forever.
  pull_request:
    branches: [dev]

jobs:
  lint-and-build:
    # Each run tests against its own throwaway Neon branch, so runs no longer
    # queue behind each other. A newer push to the same ref replaces the
    # older run; its branch is still deleted by the always() cleanup step.
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      # Throwaway placeholders for the test server started by Playwright. These
      # are not credentials: nothing in CI authenticates against Neon Auth, and
      # an unauthenticated request is redirected before the base URL is ever
      # called. They exist because app/proxy.ts resolves the auth client on a
      # guarded request and would otherwise throw with no configuration present.
      NEON_AUTH_BASE_URL: "https://auth.example.invalid/neon_auth"
      NEON_AUTH_COOKIE_SECRET: "ci-only-placeholder-not-a-real-secret-0123456789"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.26.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Branch off the default Neon branch and create an empty "ci" database
      # on it, so tests never touch production, staging, or another run.
      - name: Create throwaway Neon test database
        id: neon
        working-directory: .
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: .github/scripts/neon-ci-database.sh create "ci-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Apply migrations to the test database
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.MIGRATE_DATABASE_URL }}

      - run: pnpm test

      # Unit and integration tests are the only users of the database, so the
      # branch is removed as soon as they finish, pass or fail.
      - name: Delete throwaway Neon test database
        if: always() && steps.neon.outputs.branch_id != ''
        working-directory: .
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: .github/scripts/neon-ci-database.sh delete "${{ steps.neon.outputs.branch_id }}"

      - name: Reject browser-exposed service credentials
        run: |
          if rg -n --glob '!app/api/**' --glob '*.{ts,tsx}' 'NEXT_PUBLIC_(AWS|NEON_AUTH|BREVO|RETENTION_CRON_SECRET|QR_TICKET_SECRET)|process\.env\.(AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|NEON_AUTH_COOKIE_SECRET|BREVO|RETENTION_CRON_SECRET|QR_TICKET_SECRET)' app; then
            exit 1
          fi
      - run: pnpm lint

      # next build reuses compiled output from .next/cache. The key changes
      # whenever dependencies or source change; restore-keys falls back to the
      # newest cache for the same lockfile so most of it is still reused.
      - uses: actions/cache@v4
        with:
          path: app/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}-${{ hashFiles('app/**/*.ts', 'app/**/*.tsx', 'app/**/*.css', '!app/node_modules/**', '!app/.next/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}-

      - run: pnpm build

      # The browser download is cached per Playwright version. The OS
      # libraries it needs live outside the cache, so they are always installed.
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >>"$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - run: pnpm test:e2e
