name: CI

on:
  # Feature branches are tested through their pull request; a push run as
  # well would double the Neon branches each push needs.
  push:
    branches: [dev, main]
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"
      - ".github/scripts/**"

jobs:
  lint-and-build:
    # Each run tests against its own throwaway Neon branch, so runs no longer
    # queue behind each other. A newer push to the same ref replaces the
    # older run; its branch is still deleted by the always() cleanup step.
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      # Throwaway placeholders for the test server started by Playwright. These
      # are not credentials: nothing in CI authenticates against Neon Auth, and
      # an unauthenticated request is redirected before the base URL is ever
      # called. They exist because app/proxy.ts resolves the auth client on a
      # guarded request and would otherwise throw with no configuration present.
      NEON_AUTH_BASE_URL: "https://auth.example.invalid/neon_auth"
      NEON_AUTH_COOKIE_SECRET: "ci-only-placeholder-not-a-real-secret-0123456789"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.26.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Branch off the default Neon branch and create an empty "ci" database
      # on it, so tests never touch production, staging, or another run.
      - name: Create throwaway Neon test database
        id: neon
        working-directory: .
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: .github/scripts/neon-ci-database.sh create "ci-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Apply migrations to the test database
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.MIGRATE_DATABASE_URL }}

      - run: pnpm test

      # Unit and integration tests are the only users of the database, so the
      # branch is removed as soon as they finish, pass or fail.
      - name: Delete throwaway Neon test database
        if: always() && steps.neon.outputs.branch_id != ''
        working-directory: .
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: .github/scripts/neon-ci-database.sh delete "${{ steps.neon.outputs.branch_id }}"

      - name: Reject browser-exposed service credentials
        run: |
          if rg -n --glob '!app/api/**' --glob '*.{ts,tsx}' 'NEXT_PUBLIC_(AWS|NEON_AUTH|BREVO|RETENTION_CRON_SECRET|QR_TICKET_SECRET)|process\.env\.(AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|NEON_AUTH_COOKIE_SECRET|BREVO|RETENTION_CRON_SECRET|QR_TICKET_SECRET)' app; then
            exit 1
          fi
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
